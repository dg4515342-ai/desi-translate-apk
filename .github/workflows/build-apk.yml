name: Build DesiTranslate APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          ls
          unzip -o DesiTranslate-github-ready.zip || true
          if [ ! -d DesiTranslate-apk ] && ls DesiTranslate-apk-projec*.zip 1>/dev/null 2>&1; then
            rm -rf /tmp/p && mkdir -p /tmp/p
            unzip -o DesiTranslate-apk-projec*.zip -d /tmp/p
            cp -r /tmp/p/DesiTranslate-apk ./DesiTranslate-apk
          fi
          echo "--- tree ---"
          ls -R | head -60

      - name: Fix Gradle files (Kotlin plugin)
        run: |
          cat > DesiTranslate-apk/build.gradle <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > DesiTranslate-apk/app/build.gradle <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.desitranslate.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.desitranslate.app"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
                  debug {
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          cd DesiTranslate-apk
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DesiTranslate-debug-apk
          path: DesiTranslate-apk/app/build/outputs/apk/debug/app-debug.apk
